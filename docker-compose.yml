version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: riwi_courses_db
    environment:
      POSTGRES_DB: RiwiCoursesDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - riwi_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riwi_courses_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=RiwiCoursesDb;Username=postgres;Password=postgres
    ports:
      - "5023:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - riwi_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  riwi_network:
    driver: bridge

